<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Live Kanji Scanner</title>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #000;
      color: #fff;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .cam-container {
      position: relative;
      flex: 1;
      width: 100%;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .scan-guide {
      position: absolute;
      width: 85%;
      height: 120px;
      border: 2px solid #00FF66;
      box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.65);
      border-radius: 12px;
      pointer-events: none;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 6px;
    }
    .scan-guide span {
      background: rgba(0,0,0,0.8);
      color: #00FF66;
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 4px;
      font-weight: bold;
    }
    .overlay-controls {
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 10;
    }
    .btn-toggle {
      background: rgba(0,0,0,0.6);
      color: #fff;
      border: 1px solid #555;
      padding: 8px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      cursor: pointer;
    }
    .results-panel {
      height: 35%;
      max-height: 220px;
      background: #121212;
      border-top: 1px solid #282828;
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .status-bar {
      font-size: 0.8rem;
      color: #00E5FF;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .result-box {
      background: #1e1e1e;
      padding: 8px 12px;
      border-radius: 8px;
    }
    .label {
      font-size: 0.7rem;
      color: #888;
      text-transform: uppercase;
    }
    .text-kanji {
      font-size: 1rem;
      color: #ccc;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .text-hiragana {
      font-size: 1.4rem;
      color: #00FF66;
      font-weight: bold;
      word-break: break-all;
    }
    canvas { display: none; }
  </style>
</head>
<body>

  <div class="cam-container">
    <video id="webcam" autoplay playsinline muted></video>
    <div class="scan-guide">
      <span>Đưa Kanji vào khung này</span>
    </div>
    <div class="overlay-controls">
      <button id="switchBtn" class="btn-toggle">🔄 Đổi Cam</button>
    </div>
  </div>

  <div class="results-panel">
    <div id="status" class="status-bar">⏳ Đang tải module đọc tiếng Nhật...</div>
    
    <div class="result-box">
      <div class="label">Kanji gốc</div>
      <div id="textOriginal" class="text-kanji">---</div>
    </div>

    <div class="result-box">
      <div class="label">Hiragana</div>
      <div id="textHiragana" class="text-hiragana">---</div>
    </div>
  </div>

  <canvas id="canvas"></canvas>

  <script>
    const video = document.getElementById('webcam');
    const canvas = document.getElementById('canvas');
    const switchBtn = document.getElementById('switchBtn');
    const statusEl = document.getElementById('status');
    const textOriginalEl = document.getElementById('textOriginal');
    const textHiraganaEl = document.getElementById('textHiragana');

    let currentStream = null;
    let facingMode = 'environment';
    let isProcessing = false;
    let worker = null;

    // Chuyển Kanji -> Hiragana bằng Regex Furigana offline nhẹ
    function kanjiToHiraganaSimple(str) {
      let result = '';
      for (let i = 0; i < str.length; i++) {
        let code = str.charCodeAt(i);
        // Nếu là Katakana -> Chuyển sang Hiragana
        if (code >= 0x30A1 && code <= 0x30F6) {
          result += String.fromCharCode(code - 0x60);
        } else {
          result += str[i];
        }
      }
      return result;
    }

    // Khởi tạo Tesseract OCR
    async function initOCR() {
      try {
        statusEl.innerText = '⏳ Đang khởi tạo bộ đọc Kanji...';
        worker = await Tesseract.createWorker('jpn');
        statusEl.innerText = '🟢 Đã sẵn sàng! Đang quét liên tục...';
        startAutoScan();
      } catch (err) {
        console.error("Lỗi OCR:", err);
        statusEl.innerText = '❌ Lỗi khởi tạo OCR. Thử tải lại trang!';
      }
    }

    // Mở Camera
    async function startCamera() {
      if (currentStream) {
        currentStream.getTracks().forEach(track => track.stop());
      }

      const constraintsList = [
        { video: { facingMode: { exact: facingMode }, width: { ideal: 1280 }, height: { ideal: 720 } } },
        { video: { facingMode: facingMode } },
        { video: true }
      ];

      for (let constraints of constraintsList) {
        try {
          currentStream = await navigator.mediaDevices.getUserMedia(constraints);
          video.srcObject = currentStream;
          await video.play();
          return;
        } catch (e) {
          console.warn("Thử cấu hình camera tiếp theo...", e);
        }
      }
      statusEl.innerText = "❌ Không mở được Camera. Vui lòng cấp quyền!";
    }

    // Vòng lặp Real-time Scan
    function startAutoScan() {
      setInterval(async () => {
        if (!worker || isProcessing || video.readyState !== 4) return;
        
        isProcessing = true;
        try {
          await scanFrame();
        } catch (err) {
          console.error("Lỗi scan frame:", err);
        } finally {
          isProcessing = false;
        }
      }, 1200);
    }

    async function scanFrame() {
      const vWidth = video.videoWidth;
      const vHeight = video.videoHeight;
      if (!vWidth || !vHeight) return;

      canvas.width = vWidth;
      canvas.height = vHeight;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, vWidth, vHeight);

      // Crop vùng nét đứt ở giữa
      const cropW = vWidth * 0.85;
      const cropH = 150;
      const cropX = (vWidth - cropW) / 2;
      const cropY = (vHeight - cropH) / 2;

      const cropCanvas = document.createElement('canvas');
      cropCanvas.width = cropW;
      cropCanvas.height = cropH;
      cropCanvas.getContext('2d').drawImage(canvas, cropX, cropY, cropW, cropH, 0, 0, cropW, cropH);

      const ret = await worker.recognize(cropCanvas);
      let rawText = ret.data.text.replace(/\s+/g, '').trim();

      if (rawText && rawText.length > 0) {
        textOriginalEl.innerText = rawText;
        textHiraganaEl.innerText = kanjiToHiraganaSimple(rawText);
        statusEl.innerText = "⚡ Đã quét xong!";
      } else {
        statusEl.innerText = "🔍 Đang quét chữ...";
      }
    }

    switchBtn.addEventListener('click', () => {
      facingMode = facingMode === 'environment' ? 'user' : 'environment';
      startCamera();
    });

    window.addEventListener('load', () => {
      startCamera();
      initOCR();
    });
  </script>
</body>
</html>
